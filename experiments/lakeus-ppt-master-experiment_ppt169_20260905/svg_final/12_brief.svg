<text fill="#10243A" font-weight="700" font-size="48" x="64" y="106">Hyvä tehtävä kertoo,</text><text fill="#10243A" font-weight="700" font-size="48" x="64" y="166">miltä valmis näyttää</text><g id="brief" data-pptx-bounds="64 239 1152 347"><line x1="64" y1="239" x2="1216" y2="239" stroke="#CBD3D8" stroke-width="2" /><text x="64" y="290" font-size="24" fill="#52616B">ONGELMA</text><text x="322" y="293" font-size="32" fill="#162A3D">Huoneiston numero katoaa.</text><line x1="64" y1="324" x2="1216" y2="324" stroke="#CBD3D8" stroke-width="2" /><text x="64" y="375" font-size="24" fill="#52616B">TAVOITE</text><text x="322" y="378" font-size="32" fill="#162A3D">Arvo säilyy uudelleenlatauksessa.</text><line x1="64" y1="409" x2="1216" y2="409" stroke="#CBD3D8" stroke-width="2" /><text x="64" y="460" font-size="24" fill="#52616B">RAJA</text><text x="322" y="463" font-size="32" fill="#162A3D">Säilytä nykyinen rajapinta.</text><line x1="64" y1="494" x2="1216" y2="494" stroke="#CBD3D8" stroke-width="2" /><text x="64" y="551" font-size="24" font-weight="700" fill="#2563EB">NÄYTTÖ</text><text x="322" y="554" font-size="32" font-weight="700" fill="#2563EB">Toisto, testi ja toimiva tallennus.</text></g>
<g id="prompt" data-pptx-bounds="64 618 1152 55"><text x="64" y="654" font-size="24" fill="#52616B">“Tutki ensin syy ja ehdota pienin korjaus.” · Opetusesimerkki</text></g></svg>